[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-triage"
version = "0.1.0"
description = "POC for Omarchy PR group-triage: cluster lookalikes, bless groups, auto-classify matching shapes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.setuptools.package-data]
triage = ["web/*"]
